name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_NODE_COMPILE: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: mise install:frozen
      - run: mise check

      - name: Install futo-org/restic into restic-futo
        run: |
          mkdir -p "$RUNNER_TEMP/restic-futo"
          id=$(docker create ghcr.io/futo-org/restic:0.19.1-futo.2@sha256:72a88670ee0bbb5485c74bd9a7fb3f36d46bf3f8e29c6d0886cd6039077a3184)
          docker cp "$id:/usr/bin/restic" "$RUNNER_TEMP/restic-futo/restic"
          docker rm "$id"

      - name: Test against futo-org/restic
        run: mise exec -- sh -c 'PATH="$RUNNER_TEMP/restic-futo:$PATH" pnpm test'
